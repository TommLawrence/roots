[project]
name = "longview"
version = "0.1.0"
description = "The Long View - an agentic AI that follows one learner across years, surfacing sourced strengths and struggles for teacher-guided conversations. Built for the Agentic AI for Africa Innovation Challenge (Education track)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Longview Team" }]
dependencies = [
    "fastmcp>=2.0.0",
    "langgraph>=0.2.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.3"]

[project.scripts]
longview-datagen = "datagen.generate:main"
longview-agent = "agent.run:main"
longview-evals = "evals.run_evals:main"
longview-ui = "ui.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["datagen*", "longview_mcp*", "agent*", "evals*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
